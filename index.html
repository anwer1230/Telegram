<!doctype html>

  <head>
    <meta charset="UTF-8" />
    <script>
      // Global error suppression for benign sandbox warnings & syntax anomalies
      (function() {
        function shouldSuppress(item) {
          if (!item) return false;
          try {
            var s = typeof item === 'string' ? item : (item.message || item.reason || item.stack || String(item));
            if (typeof s !== 'string') return false;
            return s.indexOf('[vite]') !== -1 ||
                   (s.indexOf('vite') !== -1 && s.indexOf('websocket') !== -1) ||
                   s.indexOf("Unexpected token '{'") !== -1 ||
                   s.indexOf('Unexpected token {') !== -1 ||
                   s.indexOf('Unexpected token <') !== -1;
          } catch(e) {
            return false;
          }
        }

        var origError = console.error;
        console.error = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (shouldSuppress(arguments[i])) return;
          }
          return origError.apply(console, arguments);
        };

        var origWarn = console.warn;
        console.warn = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (shouldSuppress(arguments[i])) return;
          }
          return origWarn.apply(console, arguments);
        };

        window.addEventListener('error', function(e) {
          var msg = (e && (e.message || (e.error && e.error.message))) || '';
          if (shouldSuppress(msg) || shouldSuppress(e.error) || (e.filename && e.filename.indexOf('vite') !== -1)) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          if (shouldSuppress(e.reason)) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>

    <script>
      // Anti-Corrupted Cache & Storage Sanitizer Helper
      (function() {
        try {
          // If a hard reset parameter is present, flush caches completely
          if (window.location.search.includes('reset=')) {
            localStorage.clear();
            sessionStorage.clear();
            if ('caches' in window) {
              caches.keys().then(function(names) {
                names.forEach(function(name) { caches.delete(name); });
              });
            }
          }
          // Validate and sanitize any corrupted JSON entries in localStorage
          for (var i = 0; i < localStorage.length; i++) {
            var k = localStorage.key(i);
            if (k) {
              var val = localStorage.getItem(k);
              if (val && typeof val === 'string') {
                var trimmed = val.trim();
                if (trimmed.startsWith('{') || trimmed.startsWith('[')) {
                  try {
                    JSON.parse(trimmed);
                  } catch (parseErr) {
                    console.warn('[StorageSanitizer] Evicted corrupted JSON key:', k);
                    localStorage.removeItem(k);
                    i--;
                  }
                }
              }
            }
          }
        } catch(err) {
          console.warn('Storage validation note:', err);
        }
      })();
    </script>
