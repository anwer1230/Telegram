  <head>
    <meta charset="UTF-8" />
    <script>
      // Suppress benign [vite] websocket connection warnings in sandboxed preview
      (function() {
        function matchesVite(item) {
          if (!item) return false;
          try {
            var s = typeof item === 'string' ? item : (item.message || item.reason || item.stack || String(item));
            return typeof s === 'string' && (s.indexOf('[vite]') !== -1 || (s.indexOf('vite') !== -1 && s.indexOf('websocket') !== -1));
          } catch(e) {
            return false;
          }
        }

        var origError = console.error;
        console.error = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (matchesVite(arguments[i])) return;
          }
          return origError.apply(console, arguments);
        };

        var origWarn = console.warn;
        console.warn = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (matchesVite(arguments[i])) return;
          }
          return origWarn.apply(console, arguments);
        };

        window.addEventListener('error', function(e) {
          if (matchesVite(e.message) || matchesVite(e.error) || (e.filename && e.filename.indexOf('vite') !== -1)) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          if (matchesVite(e.reason)) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>

    <script>
      // Anti-Corrupted Cache & Emergency Reset Helper
      (function() {
        try {
          // If a hard reset parameter is present, flush caches completely
          if (window.location.search.includes('reset=')) {
            localStorage.clear();
            sessionStorage.clear();
            if ('caches' in window) {
              caches.keys().then(function(names) {
                names.forEach(function(name) { caches.delete(name); });
              });
            }
          }
          // Validate basic JSON parsability of critical local storage keys
          var testKeys = ['tg_multi_accounts_v3', 'app_settings', 'draft_message'];
          testKeys.forEach(function(k) {
            var val = localStorage.getItem(k);
            if (val && val.startsWith('{') || (val && val.startsWith('['))) {
              try { JSON.parse(val); } catch(e) { localStorage.removeItem(k); }
            }
          });
        } catch(err) {
          console.warn('Storage validation warning:', err);
        }
      })();
    </script>
