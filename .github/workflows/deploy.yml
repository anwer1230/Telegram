name: Auto Deploy to Render

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    name: Trigger Render Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook
        run: |
          echo "Triggering instant deployment on Render via Deploy Hook..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "https://api.render.com/deploy/srv-d9acni5aeets73dk554g?key=BULyDDcebf8")
          echo "Response from Render:"
          echo "$RESPONSE"
          if echo "$RESPONSE" | grep -q "HTTP_STATUS:2"; then
            echo "✅ Render deployment successfully initiated!"
          else
            echo "⚠️ Non-2xx status code received from Render, please verify hook status."
          fi
