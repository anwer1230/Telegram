<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="pwa-grad-mask" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#8A2BE2" />
      <stop offset="100%" stop-color="#FF69B4" />
    </linearGradient>
    <filter id="plane-shadow-mask" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35" />
    </filter>
    <filter id="badge-shadow-mask" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Full Bleed Square Background for Maskable Icon -->
  <rect width="512" height="512" fill="url(#pwa-grad-mask)" />
  
  <!-- Subtle circular guide inside safe zone -->
  <circle cx="256" cy="256" r="205" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.15" />

  <!-- Paper Airplane inside Safe Zone (scaled to 0.76) -->
  <g transform="translate(80, 64) scale(0.76)">
    <path fill="#FFFFFF" filter="url(#plane-shadow-mask)" d="M403.4 121.2L68.7 250.3c-22.9 8.9-22.7 21.7-4.1 27.4l85.8 26.8 198.8-125.4c9.4-5.7 18-2.6 11 3.6L199.1 328.2l-6.2 87.8c8.6 0 12.4-3.9 17.2-8.6l41.3-40.2 85.9 63.4c15.8 8.7 27.2 4.2 31.1-14.7l56.3-265.4c5.8-23.2-8.8-33.7-24-27.3z" />
  </g>

  <!-- Green Checkmark Badge inside Safe Zone -->
  <g filter="url(#badge-shadow-mask)">
    <circle cx="365" cy="365" r="52" fill="#22C55E" stroke="#FFFFFF" stroke-width="8" />
    <path d="M343 365 L358 380 L388 350" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>